[project]
name = "opportunity-tracker"
version = "0.1.0"
description = "Single-user CLI that discovers, verifies, and ranks scholarship/research-degree opportunities."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "playwright>=1.45",
    "pdfplumber>=0.11",
    "groq>=0.11",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "tldextract>=5.1",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
optrack = "opportunity_tracker.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_tracker"]
