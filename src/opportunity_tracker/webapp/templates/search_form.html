{% extends "base.html" %}

{% block title %}{% if existing %}Edit Search{% else %}New Search{% endif %} - Opportunity Tracker{% endblock %}

{% block content %}
<h1>{% if existing %}Edit Search{% else %}New Search{% endif %}</h1>

<div class="card" style="max-width: 40rem;">
  <form method="post" action="{{ form_action }}">

    <div class="form-group">
      <label for="name">Name</label>
      <input
        type="text" id="name" name="name" required
        value="{{ existing.name if existing else '' }}"
      >
    </div>

    <div class="form-group">
      <label for="country">Country</label>
      <input
        type="text" id="country" name="country" required
        value="{{ existing.country if existing else '' }}"
      >
    </div>

    <div class="form-group">
      <label>Degree levels</label>
      <div class="checkbox-group">
        <label>
          <input
            type="checkbox" name="degree_levels" value="phd"
            {% if existing and 'phd' in existing.degree_levels %}checked{% endif %}
          >
          PhD
        </label>
        <label>
          <input
            type="checkbox" name="degree_levels" value="masters"
            {% if existing and 'masters' in existing.degree_levels %}checked{% endif %}
          >
          Masters
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="fields">Fields (comma-separated)</label>
      <input
        type="text" id="fields" name="fields" required
        value="{{ existing.fields | join(', ') if existing else '' }}"
      >
    </div>

    <div class="form-group">
      <label for="funding_type">Funding type</label>
      <input
        type="text" id="funding_type" name="funding_type"
        value="{{ existing.funding_type if existing else '' }}"
      >
    </div>

    <div class="form-group">
      <label for="deadline_after">Deadline after</label>
      <input
        type="date" id="deadline_after" name="deadline_after"
        value="{{ existing.deadline_after if existing else '' }}"
      >
    </div>

    <div class="form-group">
      <label for="min_grade">Minimum grade</label>
      <input
        type="text" id="min_grade" name="min_grade"
        value="{{ existing.min_grade if existing else '' }}"
      >
    </div>

    <div class="form-group">
      <label for="institution_cap">Institution cap</label>
      <input
        type="number" step="1" min="1" id="institution_cap" name="institution_cap"
        value="{{ existing.institution_cap if existing else 50 }}"
      >
    </div>

    <button type="submit" class="btn btn-primary">Save Search</button>
  </form>
</div>
{% endblock %}
